<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/default :: layout(~{::content})}">
<body>
<div th:fragment="content" class="max-w-md mx-auto py-8">
    <div class="bg-white p-8 rounded-2xl border border-slate-200/80 shadow-sm">
        <!-- 헤더 타이틀 -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-blue-600 text-white font-extrabold text-2xl flex items-center justify-center mx-auto mb-3 shadow-md shadow-blue-500/20">
                U
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">로그인</h1>
            <p class="text-sm text-slate-500 mt-1">UniClass 수업 플랫폼에 오신 것을 환영합니다</p>
        </div>

        <!-- 성공 메시지 (회원가입 후 리다이렉트 시) -->
        <div id="loginSuccessBanner" th:if="${successMessage}" class="mb-5 p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm flex items-center justify-between transition-opacity duration-500">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span th:text="${successMessage}"></span>
            </div>
            <button type="button" onclick="document.getElementById('loginSuccessBanner').remove()" class="text-slate-400 hover:text-slate-600 p-1 rounded hover:bg-emerald-100/50">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- 에러 메시지 -->
        <div id="loginErrorBanner" th:if="${errorMessage}" class="mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm flex items-center justify-between transition-opacity duration-500">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span th:text="${errorMessage}"></span>
            </div>
            <button type="button" onclick="document.getElementById('loginErrorBanner').remove()" class="text-slate-400 hover:text-slate-600 p-1 rounded hover:bg-rose-100/50">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- 로그인 폼 -->
        <form th:action="@{/login}" method="post" class="space-y-5">
            <!-- 이메일 -->
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">이메일</label>
                <input type="email" id="email" name="email" required autofocus
                       placeholder="example@univ.ac.kr"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm placeholder:text-slate-400">
            </div>

            <!-- 비밀번호 -->
            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">비밀번호</label>
                <input type="password" id="password" name="password" required
                       placeholder="••••••••"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm placeholder:text-slate-400">
            </div>

            <!-- 로그인 버튼 -->
            <button type="submit"
                    class="w-full py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md shadow-blue-500/20 hover:shadow-lg hover:shadow-blue-500/30 transition">
                로그인하기
            </button>
        </form>

        <!-- 회원가입 안내 링크 -->
        <div class="mt-6 pt-5 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500">
                아직 계정이 없으신가요?
                <a th:href="@{/register}" class="font-bold text-blue-600 hover:text-blue-700 hover:underline ml-1">회원가입하기</a>
            </p>
        </div>
    </div>

    <!-- 스크립트: 알림 배너 자동 페이드아웃 -->
    <script>
        ['loginSuccessBanner', 'loginErrorBanner'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                setTimeout(() => {
                    el.classList.add('opacity-0');
                    setTimeout(() => el.remove(), 500);
                }, 3500);
            }
        });
    </script>
</div>
</body>
</html>
