<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/default :: layout(~{::content})}">
<body>
<div th:fragment="content" class="max-w-lg mx-auto py-8">
    <div class="bg-white p-8 rounded-2xl border border-slate-200/80 shadow-sm">
        <!-- 헤더 타이틀 -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">회원가입</h1>
            <p class="text-sm text-slate-500 mt-1">UniClass에서 수업과 과제를 편리하게 관리하세요</p>
        </div>

        <!-- 글로벌 에러 메시지 (중복 이메일/학번 등) -->
        <div th:if="${#fields.hasGlobalErrors()}" class="mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm flex items-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
        </div>

        <!-- 회원가입 폼 -->
        <form th:action="@{/register}" th:object="${form}" method="post" class="space-y-5">
            <!-- 가입 구분 (역할 선택) -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">가입 구분</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition [&:has(:checked)]:border-blue-600 [&:has(:checked)]:bg-blue-50/50">
                        <input type="radio" th:field="*{role}" value="ROLE_STUDENT" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                        <div>
                            <span class="block text-sm font-bold text-slate-900">학생 (Student)</span>
                            <span class="block text-xs text-slate-500">수업 참여 및 과제 제출</span>
                        </div>
                    </label>
                    <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition [&:has(:checked)]:border-blue-600 [&:has(:checked)]:bg-blue-50/50">
                        <input type="radio" th:field="*{role}" value="ROLE_INSTRUCTOR" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                        <div>
                            <span class="block text-sm font-bold text-slate-900">교수 (Instructor)</span>
                            <span class="block text-xs text-slate-500">수업 개설 및 과제 출제</span>
                        </div>
                    </label>
                </div>
                <p th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
            </div>

            <!-- 실명 -->
            <div>
                <label for="name" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">이름 (실명)</label>
                <input type="text" id="name" th:field="*{name}"
                       placeholder="홍길동"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm placeholder:text-slate-400">
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
            </div>

            <!-- 학번 또는 교번 (필수 항목) -->
            <div>
                <label for="studentNo" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
                    학번 또는 교번 <span class="text-rose-500">*</span>
                </label>
                <input type="text" id="studentNo" th:field="*{studentNo}"
                       placeholder="예: 20261234 또는 교수 교번"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm placeholder:text-slate-400">
                <p class="text-[11px] text-slate-400 mt-1">출석 확인 및 성적 처리에 필수적인 고유 번호입니다.</p>
                <p th:if="${#fields.hasErrors('studentNo')}" th:errors="*{studentNo}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
            </div>

            <!-- 이메일 -->
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">이메일</label>
                <input type="email" id="email" th:field="*{email}"
                       placeholder="example@univ.ac.kr"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm placeholder:text-slate-400">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
            </div>

            <!-- 비밀번호 -->
            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">비밀번호</label>
                <input type="password" id="password" th:field="*{password}"
                       placeholder="6자 이상 100자 이하"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm placeholder:text-slate-400">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
            </div>

            <!-- 비밀번호 확인 -->
            <div>
                <label for="passwordConfirm" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">비밀번호 확인</label>
                <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}"
                       placeholder="동일한 비밀번호를 한 번 더 입력하세요"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm placeholder:text-slate-400">
                <p th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
            </div>

            <!-- 회원가입 버튼 -->
            <button type="submit"
                    class="w-full py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md shadow-blue-500/20 hover:shadow-lg hover:shadow-blue-500/30 transition">
                회원가입 완료하기
            </button>
        </form>

        <!-- 로그인 링크 -->
        <div class="mt-6 pt-5 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500">
                이미 계정이 있으신가요?
                <a th:href="@{/login}" class="font-bold text-blue-600 hover:text-blue-700 hover:underline ml-1">로그인하기</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
