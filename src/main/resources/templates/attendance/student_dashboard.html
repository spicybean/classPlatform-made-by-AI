<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/default :: layout(~{::content})}">
<head>
    <title>내 출석 현황 - UniClass</title>
</head>
<body>
<div th:fragment="content" class="max-w-4xl mx-auto space-y-6">

    <!-- 브레드크럼 -->
    <nav class="flex items-center gap-2 text-xs text-slate-500">
        <a th:href="@{/classes}" class="hover:text-blue-600 transition">클래스룸</a>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        <a th:href="@{/classes/{id}(id=${classroom.id})}" th:text="${classroom.name}" class="hover:text-blue-600 transition">수업명</a>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        <span class="text-slate-800 font-semibold">내 출석 현황</span>
    </nav>

    <!-- 알림 메시지 배너 -->
    <div th:if="${successMessage}" class="p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm flex items-center justify-between shadow-sm animate-fade-in">
        <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <span th:text="${successMessage}"></span>
        </div>
    </div>
    <div th:if="${errorMessage}" class="p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm flex items-center justify-between shadow-sm animate-fade-in">
        <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span th:text="${errorMessage}"></span>
        </div>
    </div>

    <!-- 1. 활성 출석 세션이 있을 때: 4자리 출석 인증번호 입력 카드 -->
    <div th:if="${summary.activeSession != null}" class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-6 sm:p-8 text-white shadow-xl">
        <div class="max-w-md mx-auto text-center space-y-4">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-amber-400 text-slate-900 shadow-sm animate-bounce">
                ⚡ 실시간 출석 체크 진행 중!
            </span>
            <h2 class="text-2xl font-black" th:text="${summary.activeSession.title}">1주차 1차시 출석</h2>
            <p class="text-blue-100 text-xs sm:text-sm">교수님이 화면에 띄운 4자리 인증번호를 입력하세요.</p>

            <!-- 이미 출석 완료한 경우 -->
            <div th:if="${summary.alreadyAttendedActiveSession}" class="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-5 text-center">
                <div class="w-12 h-12 rounded-full bg-emerald-400/20 text-emerald-300 flex items-center justify-center mx-auto text-2xl font-bold mb-2">
                    ✓
                </div>
                <h3 class="font-extrabold text-base text-white">출석 완료</h3>
                <p class="text-xs text-blue-200 mt-1">이번 차시 출석이 정상 반영되었습니다.</p>
            </div>

            <!-- 아직 출석하지 않은 경우: 번호 입력 폼 -->
            <div th:unless="${summary.alreadyAttendedActiveSession}" class="bg-white rounded-2xl p-6 text-slate-900 shadow-2xl">
                <form th:action="@{/classes/{id}/attendance/submit(id=${classroom.id})}" th:object="${submitForm}" method="post" class="space-y-4">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    
                    <div>
                        <label for="authCode" class="block text-xs font-bold text-slate-600 mb-2 uppercase tracking-wider">
                            4자리 인증번호 입력
                        </label>
                        <input type="text" id="authCode" th:field="*{authCode}" maxlength="4" placeholder="0000" autofocus
                               pattern="[0-9]{4}" inputmode="numeric" autocomplete="one-time-code"
                               class="w-48 mx-auto text-center font-mono font-black text-3xl sm:text-4xl tracking-[0.3em] px-4 py-3 rounded-xl border-2 border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-100 transition shadow-inner">
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3 rounded-xl text-sm shadow-md transition flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                        출석 체크 완료하기
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- 2. 나의 출석 통계 카드 -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <!-- 출석률 -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
            <span class="text-xs font-semibold text-slate-500 block mb-1">총 출석률</span>
            <span class="text-2xl sm:text-3xl font-black text-blue-600" th:text="${summary.attendanceRate} + '%'">100%</span>
        </div>
        <!-- 출석 -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
            <span class="text-xs font-semibold text-slate-500 block mb-1">정상 출석</span>
            <span class="text-2xl sm:text-3xl font-black text-emerald-600" th:text="${summary.presentCount} + '회'">0회</span>
        </div>
        <!-- 지각 -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
            <span class="text-xs font-semibold text-slate-500 block mb-1">지각</span>
            <span class="text-2xl sm:text-3xl font-black text-amber-500" th:text="${summary.lateCount} + '회'">0회</span>
        </div>
        <!-- 결석 -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
            <span class="text-xs font-semibold text-slate-500 block mb-1">결석</span>
            <span class="text-2xl sm:text-3xl font-black text-rose-500" th:text="${summary.absentCount} + '회'">0회</span>
        </div>
    </div>

    <!-- 3. 나의 주차별 출결 기록 목록 -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-5 border-b border-slate-100 flex justify-between items-center">
            <h3 class="font-bold text-slate-900 text-base">내 출석 기록</h3>
            <span class="text-xs text-slate-500" th:text="'총 ' + ${summary.totalSessions} + '회차 중 ' + ${#lists.size(summary.myRecords)} + '회 기록'">총 0회</span>
        </div>

        <div th:if="${#lists.isEmpty(summary.myRecords)}" class="p-10 text-center text-slate-400 text-sm">
            아직 기록된 출석 데이터가 없습니다.
        </div>

        <div th:unless="${#lists.isEmpty(summary.myRecords)}" class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs sm:text-sm">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold uppercase tracking-wider text-[11px]">
                        <th class="py-3 px-4">출석 회차</th>
                        <th class="py-3 px-4">입력 일시</th>
                        <th class="py-3 px-4 text-center">출결 상태</th>
                        <th class="py-3 px-4">비고</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <tr th:each="r : ${summary.myRecords}" class="hover:bg-slate-50/80 transition">
                        <td class="py-3.5 px-4 font-bold text-slate-800" th:text="${r.studentName} != null ? '출석 체크' : '출석'">출석</td>
                        <td class="py-3.5 px-4 text-slate-500" th:text="${r.attendedAt}">14:02:15</td>
                        <td class="py-3.5 px-4 text-center">
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold border"
                                  th:classappend="${r.badgeClass}"
                                  th:text="${r.statusDescription}">출석</span>
                        </td>
                        <td class="py-3.5 px-4 text-slate-400 text-xs" th:text="${r.remark ?: '-'}">-</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
