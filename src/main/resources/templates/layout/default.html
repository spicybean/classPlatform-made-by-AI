<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniClass - 스마트 학습 관리 플랫폼</title>
    <!-- FontAwesome 6.5.1 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Pretendard Variable 웹폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', '"Noto Sans KR"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans antialiased selection:bg-blue-100 selection:text-blue-900">

    <!-- 상단 네비게이션 헤더 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- 로고 & 서비스명 -->
                <div class="flex items-center gap-3">
                    <a href="/" class="flex items-center gap-2">
                        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
                            U
                        </div>
                        <span class="font-extrabold text-xl tracking-tight text-slate-900">UniClass</span>
                    </a>
                    <span class="hidden sm:inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200"
                          th:text="${currentSemester ?: '2026-1학기'}">
                        2026-1학기
                    </span>
                </div>

                <!-- 중앙 빠른 메뉴 -->
                <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600">
                    <a th:href="@{/}" class="hover:text-blue-600 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-house text-xs text-slate-400"></i>
                        <span>캠퍼스 포털</span>
                    </a>
                    <a th:href="@{/classes}" class="hover:text-blue-600 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-book-open text-xs text-slate-400"></i>
                        <span>클래스룸</span>
                    </a>
                    <!-- 🌟 교수 전용: 내 영구 자료 보관함 (My Library) -->
                    <a sec:authorize="hasRole('ROLE_INSTRUCTOR')" th:href="@{/library}"
                       class="hover:text-indigo-700 font-bold transition flex items-center gap-1.5 text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg border border-indigo-100 shadow-xs">
                        <i class="fa-solid fa-box-archive text-xs text-indigo-500"></i>
                        <span>내 보관함</span>
                    </a>
                    <a th:href="@{/#academic-calendar}" class="hover:text-blue-600 transition flex items-center gap-1.5">
                        <i class="fa-regular fa-calendar text-xs text-slate-400"></i>
                        <span>학사 캘린더</span>
                    </a>
                    <a href="/h2-console" target="_blank" class="hover:text-slate-900 transition text-xs text-amber-600 bg-amber-50 px-2 py-1 rounded border border-amber-200">H2 콘솔 (개발용)</a>
                </nav>

                <!-- 우측 인증 영역 -->
                <div class="flex items-center gap-3">
                    <!-- 비로그인 상태 -->
                    <th:block sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" class="text-sm font-medium text-slate-700 hover:text-slate-900 px-3 py-1.5 rounded-lg hover:bg-slate-100 transition">
                            로그인
                        </a>
                        <a th:href="@{/register}" class="text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg shadow-sm hover:shadow transition">
                            회원가입
                        </a>
                    </th:block>

                    <!-- 로그인 상태 -->
                    <th:block sec:authorize="isAuthenticated()">
                        <div class="flex items-center gap-1.5 sm:gap-2 px-2.5 sm:px-3 py-1.5 rounded-xl bg-slate-100 text-xs font-semibold text-slate-700">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 flex-shrink-0"></span>
                            <span sec:authentication="principal.name">홍길동</span>
                            <span class="hidden sm:inline text-slate-400 font-normal">|</span>
                            <span class="hidden sm:inline text-blue-600 font-mono" sec:authentication="principal.studentNo">20260001</span>
                            <span class="px-1.5 py-0.5 rounded text-[10px] bg-white border border-slate-200 text-slate-600 flex-shrink-0"
                                  sec:authorize="hasRole('ROLE_INSTRUCTOR')">교수</span>
                            <span class="px-1.5 py-0.5 rounded text-[10px] bg-white border border-slate-200 text-slate-600 flex-shrink-0"
                                  sec:authorize="hasRole('ROLE_STUDENT')">학생</span>
                        </div>
                        <form th:action="@{/logout}" method="post" class="inline m-0">
                            <button type="submit" class="text-xs font-medium text-slate-500 hover:text-rose-600 px-2.5 py-1.5 rounded-lg hover:bg-rose-50 transition">
                                로그아웃
                            </button>
                        </form>
                    </th:block>
                </div>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <th:block th:replace="${content}" />
    </main>

    <!-- 전역 플로팅 토스트 알림 컨테이너 (우측 상단) -->
    <div id="globalToastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none max-w-sm w-full"></div>

    <!-- 하단 푸터 -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500">
            <p>© 2026 UniClass Platform. All rights reserved. Made by AI Pair Programming.</p>
        </div>
    </footer>

    <!-- 전역 모달 키보드(ESC) 및 배경 클릭 이벤트 리스너 -->
    <script>
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.querySelectorAll('.fixed.inset-0:not(.hidden)').forEach(modal => {
                    modal.classList.add('hidden');
                });
            }
        });

        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('fixed') && e.target.classList.contains('inset-0') && !e.target.classList.contains('hidden')) {
                e.target.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
