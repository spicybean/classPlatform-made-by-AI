<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/default :: layout(~{::content})}">
<body>
<div th:fragment="content" class="max-w-md mx-auto py-8">
    <div class="bg-white p-8 rounded-2xl border border-slate-200/80 shadow-sm">
        <!-- 헤더 타이틀 -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto mb-3 text-2xl font-bold">
                🔑
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">수업 참가하기</h1>
            <p class="text-sm text-slate-500 mt-1">교수님께 전달받은 6자리 초대 코드를 입력하세요</p>
        </div>

        <!-- 글로벌 에러 메시지 (초대코드 불일치, 이미 참가 등) -->
        <div th:if="${#fields.hasGlobalErrors()}" class="mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm flex items-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
        </div>

        <!-- 폼 -->
        <form th:action="@{/classes/join}" th:object="${form}" method="post" class="space-y-6">
            <div>
                <label for="inviteCode" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2 text-center">
                    초대 코드 (6자리)
                </label>
                <input type="text" id="inviteCode" th:field="*{inviteCode}" maxlength="6" autofocus
                       placeholder="예: CS101A"
                       class="w-full text-center tracking-[0.3em] font-mono text-2xl font-bold uppercase px-4 py-3 rounded-xl border border-slate-300 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm placeholder:text-slate-300 placeholder:tracking-normal placeholder:font-sans placeholder:text-base">
                <p th:if="${#fields.hasErrors('inviteCode')}" th:errors="*{inviteCode}" class="text-xs text-rose-600 mt-1.5 font-medium text-center"></p>
                <p class="text-[11px] text-slate-400 mt-2 text-center">대소문자 구분 없이 입력하실 수 있습니다.</p>
            </div>

            <!-- 참가 버튼 -->
            <button type="submit"
                    class="w-full py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md shadow-blue-500/20 hover:shadow-lg transition">
                수강 신청 및 수업 입장
            </button>
        </form>

        <!-- 돌아가기 링크 -->
        <div class="mt-6 pt-5 border-t border-slate-100 text-center">
            <a th:href="@{/}" class="text-xs font-semibold text-slate-500 hover:text-slate-800 transition">
                ← 메인 대시보드로 돌아가기
            </a>
        </div>
    </div>
</div>
</body>
</html>
