server:
  port: 8080

spring:
  application:
    name: uniclass

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:uniclassdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # File Upload Limit Configuration (20MB for slides/assignments)
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

# UniClass Custom Configuration
uniclass:
  current-semester: 2026-1학기
